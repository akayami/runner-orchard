name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s macos -p 'test_*.py' -v
      - run: bash -n install.sh macos/install.sh macos/power-service.sh
  swift:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: xcrun swiftc -swift-version 5 -O macos/ApplePower.swift -o "$RUNNER_TEMP/runner-orchard-power"
