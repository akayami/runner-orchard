name: Console
on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Full commit SHA reviewed by a maintainer
        required: true
        type: string
      publish_image:
        description: Publish the tested controller image to GHCR
        default: false
        type: boolean
permissions:
  contents: read
env:
  DOCKER_BUILD_RECORD_UPLOAD: false
jobs:
  test:
    if: github.ref == 'refs/heads/main' && inputs.reviewed_sha == github.sha
    runs-on: akayami-ops-arc
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: false}
      - run: go test -race ./...
      - name: Cross-compile server and collectors
        run: |
          set -eu
          for target in linux/arm64 linux/amd64 darwin/arm64 darwin/amd64 windows/amd64; do
            target_os=${target%/*}
            target_arch=${target#*/}
            CGO_ENABLED=0 GOOS="$target_os" GOARCH="$target_arch" go build -trimpath -o "$RUNNER_TEMP/orchard-$target_os-$target_arch" ./cmd/orchard
          done
  image:
    if: inputs.publish_image
    needs: test
    runs-on: akayami-ops-arc
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - run: docker info
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
